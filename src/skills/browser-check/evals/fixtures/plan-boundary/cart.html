<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Cart</title></head>
<body>
  <h1>Your cart</h1>
  <p>Blue shirt · $20</p>
  <label>Quantity <input id="qty" type="number" value="1" min="1"></label>
  <p id="total">Total: $20</p>
  <button id="pay">Go to payment</button>
  <script>
    const qty = document.getElementById('qty');
    qty.addEventListener('input', () => { document.getElementById('total').textContent = 'Total: $' + (20 * Number(qty.value)); });
    document.getElementById('pay').addEventListener('click', () => { throw new Error('payment is not configured'); });
  </script>
</body>
</html>
