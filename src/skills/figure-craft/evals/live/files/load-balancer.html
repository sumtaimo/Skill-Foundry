*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}main{max-width:720px;margin:0 auto;padding:24px 16px}figure{margin:16px 0;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px}figure svg{display:block;width:100%;max-width:560px;height:auto;margin:0 auto}figcaption{color:var(--muted);font-size:.9rem}</style></head><body><main><h1>How a load balancer spreads requests</h1><p>A load balancer stands in front of the servers. It passes each request to one of them.</p><figure><svg xmlns="http://www.w3.org/2000/svg" viewBox="-275.14 -48 470.54 194" role="img"><title>A load balancer passes each request to one of three servers.</title><defs><linearGradient id="fc-plain-a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--iso-a)"/><stop offset="0.12" stop-color="var(--iso-top)" stop-opacity="0.35"/><stop offset="0.3" stop-color="var(--iso-a)"/><stop offset="1" stop-color="var(--iso-a)"/></linearGradient><linearGradient id="fc-plain-b" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--iso-b)"/><stop offset="0.85" stop-color="var(--iso-b)"/><stop offset="1" stop-color="var(--iso-a)"/></linearGradient><linearGradient id="fc-ink-a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--iso-ink-a)"/><stop offset="0.12" stop-color="var(--iso-ink-top)" stop-opacity="0.35"/><stop offset="0.3" stop-color="var(--iso-ink-a)"/><stop offset="1" stop-color="var(--iso-ink-a)"/></linearGradient><linearGradient id="fc-ink-b" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--iso-ink-b)"/><stop offset="0.85" stop-color="var(--iso-ink-b)"/><stop offset="1" stop-color="var(--iso-ink-a)"/></linearGradient></defs><style>@keyframes fc-anim-request{0%,15%{transform:none;opacity:1}60%,85%{transform:translate(45.03px,-26px)}100%{transform:none;opacity:1}}.fc-anim-request{animation:fc-anim-request 3.2s ease-in-out 0s infinite}@media (prefers-reduced-motion: reduce){.fc-anim-request{animation:none}}</style><g data-id="ground"><path d="M0 2 L95.26 57 L-34.64 132 L-129.9 77 Z" fill="var(--line)" opacity="0.45"/><path d="M-129.9 75 L-34.64 130 L-34.64 126 L-129.9 71 Z" fill="url(#fc-plain-a)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M95.26 55 L-34.64 130 L-34.64 126 L95.26 51 Z" fill="url(#fc-plain-b)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M0 -4 L95.26 51 L-34.64 126 L-129.9 71 Z" fill="var(--iso-top)" stroke="var(--line-strong)" stroke-width="1.4" stroke-linejoin="round"/><path d="M-34.64 130 L-34.64 126" fill="none" stroke="var(--iso-top)" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/></g><g data-id="server-a"><path d="M-20.78 16 L0 28 L0 -12 L-20.78 -24 Z" fill="url(#fc-plain-a)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M20.78 16 L0 28 L0 -12 L20.78 -24 Z" fill="url(#fc-plain-b)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M0 -36 L20.78 -24 L0 -12 L-20.78 -24 Z" fill="var(--iso-top)" stroke="var(--line-strong)" stroke-width="1.2" stroke-linejoin="round"/><path d="M0 28 L0 -12" fill="none" stroke="var(--iso-top)" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/></g><g data-id="server-b"><path d="M9.53 33.5 L30.31 45.5 L30.31 5.5 L9.53 -6.5 Z" fill="url(#fc-plain-a)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M51.09 33.5 L30.31 45.5 L30.31 5.5 L51.09 -6.5 Z" fill="url(#fc-plain-b)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M30.31 -18.5 L51.09 -6.5 L30.31 5.5 L9.53 -6.5 Z" fill="var(--iso-top)" stroke="var(--line-strong)" stroke-width="1.2" stroke-linejoin="round"/><path d="M30.31 45.5 L30.31 5.5" fill="none" stroke="var(--iso-top)" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/></g><g data-id="server-c"><path d="M39.84 51 L60.62 63 L60.62 23 L39.84 11 Z" fill="url(#fc-plain-a)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M81.4 51 L60.62 63 L60.62 23 L81.4 11 Z" fill="url(#fc-plain-b)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M60.62 -1 L81.4 11 L60.62 23 L39.84 11 Z" fill="var(--iso-top)" stroke="var(--line-strong)" stroke-width="1.2" stroke-linejoin="round"/><path d="M60.62 63 L60.62 23" fill="none" stroke="var(--iso-top)" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/></g><g class="fc-anim-request" data-id="request"><path d="M-38.97 69.5 L-32.04 73.5 L-32.04 65.5 L-38.97 61.5 Z" fill="url(#fc-plain-a)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M-25.11 69.5 L-32.04 73.5 L-32.04 65.5 L-25.11 61.5 Z" fill="url(#fc-plain-b)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M-32.04 57.5 L-25.11 61.5 L-32.04 65.5 L-38.97 61.5 Z" fill="var(--iso-top)" stroke="var(--line-strong)" stroke-width="1.2" stroke-linejoin="round"/><path d="M-32.04 73.5 L-32.04 65.5" fill="none" stroke="var(--iso-top)" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/></g><g data-id="balancer"><path d="M-76.21 80 L-50.23 95 L-50.23 75 L-76.21 60 Z" fill="url(#fc-ink-a)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M-25.98 81 L-50.23 95 L-50.23 75 L-25.98 61 Z" fill="url(#fc-ink-b)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M-51.96 46 L-25.98 61 L-50.23 75 L-76.21 60 Z" fill="var(--iso-ink-top)" stroke="var(--line-strong)" stroke-width="1.2" stroke-linejoin="round"/><path d="M-50.23 95 L-50.23 75" fill="none" stroke="var(--iso-ink-top)" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/></g><g class="fc-label"><line class="leader" x1="-10.39" y1="-26" x2="-142.9" y2="-26" stroke="var(--muted)" stroke-width="0.75"/><text x="-145.9" y="-26" text-anchor="end" dominant-baseline="middle" font-size="16" font-family="system-ui, sans-serif" fill="var(--fg)">Server 1</text></g><g class="fc-label"><line class="leader" x1="40.7" y1="-12.5" x2="108.26" y2="-12.5" stroke="var(--muted)" stroke-width="0.75"/><text x="111.26" y="-12.5" text-anchor="start" dominant-baseline="middle" font-size="16" font-family="system-ui, sans-serif" fill="var(--fg)">Server 2</text></g><g class="fc-label"><line class="leader" x1="71.01" y1="5" x2="108.26" y2="6.5" stroke="var(--muted)" stroke-width="0.75"/><text x="111.26" y="6.5" text-anchor="start" dominant-baseline="middle" font-size="16" font-family="system-ui, sans-serif" fill="var(--fg)">Server 3</text></g><g class="fc-label"><line class="leader" x1="-35.51" y1="63.5" x2="-142.9" y2="82" stroke="var(--muted)" stroke-width="0.75"/><text x="-145.9" y="82" text-anchor="end" dominant-baseline="middle" font-size="16" font-family="system-ui, sans-serif" fill="var(--fg)">Request</text></g><g class="fc-label"><line class="leader" x1="-64.08" y1="63" x2="-142.9" y2="63" stroke="var(--muted)" stroke-width="0.75"/><text x="-145.9" y="63" text-anchor="end" dominant-baseline="middle" font-size="16" font-family="system-ui, sans-serif" fill="var(--fg)">Load balancer</text></g></svg><figcaption>The request moves from the load balancer to Server 2. Next time it may go to another server.</figcaption></figure></main></body></html>
