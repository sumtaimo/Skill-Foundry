<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CDN Edge Cache</title>
<style>:root{--bg:#f7f6f2;--surface:#ffffff;--surface2:#efede6;--line:#d9d5ca;--line-strong:#8f8a7c;--fg:#1d1c19;--muted:#5c5850;--faint:#8a857a;--ok:#2f8f5b;--warn:#b7791f;--danger:#c0392b;--iso-top:#ffffff;--iso-a:#e6e2d8;--iso-b:#cfc9bb;--iso-ink:#2b2a27;--iso-ink-top:#4a4843;--iso-ink-a:#33312d;--iso-ink-b:#22211e;}
[data-theme="dark"]{--bg:#141413;--surface:#1d1c1a;--surface2:#262522;--line:#3a3833;--line-strong:#77736a;--fg:#f1efe8;--muted:#b3aea2;--faint:#8a857a;--ok:#4fbf83;--warn:#e0a84a;--danger:#e5675a;--iso-top:#3b3934;--iso-a:#2d2b27;--iso-b:#22211e;--iso-ink:#e8e4da;--iso-ink-top:#f6f3ec;--iso-ink-a:#d6d1c5;--iso-ink-b:#bdb7a9;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141413;--surface:#1d1c1a;--surface2:#262522;--line:#3a3833;--line-strong:#77736a;--fg:#f1efe8;--muted:#b3aea2;--faint:#8a857a;--ok:#4fbf83;--warn:#e0a84a;--danger:#e5675a;--iso-top:#3b3934;--iso-a:#2d2b27;--iso-b:#22211e;--iso-ink:#e8e4da;--iso-ink-top:#f6f3ec;--iso-ink-a:#d6d1c5;--iso-ink-b:#bdb7a9;}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:24px 16px 48px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:1.5rem;margin:0}.kicker{color:var(--muted);font-size:.85rem;margin:0 0 4px}
button{font:inherit;font-size:.9rem;color:var(--fg);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:6px 12px;cursor:pointer}
button:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
figure{margin:24px 0;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
figure svg{display:block;width:100%;max-width:560px;height:auto;margin:0 auto}figcaption{color:var(--muted);font-size:.9rem;margin-top:8px}
.controls{display:flex;gap:8px;margin-top:12px}.paused svg *{animation-play-state:paused!important}
dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:0}dl div{background:var(--surface2);border-radius:10px;padding:12px}
dt{color:var(--muted);font-size:.8rem}dd{margin:0;font-weight:600}@media (max-width:480px){figure{padding:8px}}</style></head><body><main>
<header><div><p class="kicker">FIGURE</p><h1>How a CDN edge cache serves a request</h1></div><button type="button" id="theme" aria-pressed="false">Dark theme</button></header>
<p>The edge cache sits close to the reader. When it already holds a copy, it answers at once. The origin is not asked.</p>
<figure id="fig"><svg xmlns="http://www.w3.org/2000/svg" viewBox="-158.87 -19 514.45 150" role="img"><title>A request travels from the client to the edge cache, which answers from its copy without asking the origin.</title><defs><linearGradient id="fc-plain-a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--iso-a)"/><stop offset="0.12" stop-color="var(--iso-top)" stop-opacity="0.35"/><stop offset="0.3" stop-color="var(--iso-a)"/><stop offset="1" stop-color="var(--iso-a)"/></linearGradient><linearGradient id="fc-plain-b" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--iso-b)"/><stop offset="0.85" stop-color="var(--iso-b)"/><stop offset="1" stop-color="var(--iso-a)"/></linearGradient><linearGradient id="fc-ink-a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--iso-ink-a)"/><stop offset="0.12" stop-color="var(--iso-ink-top)" stop-opacity="0.35"/><stop offset="0.3" stop-color="var(--iso-ink-a)"/><stop offset="1" stop-color="var(--iso-ink-a)"/></linearGradient><linearGradient id="fc-ink-b" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--iso-ink-b)"/><stop offset="0.85" stop-color="var(--iso-ink-b)"/><stop offset="1" stop-color="var(--iso-ink-a)"/></linearGradient></defs><style>@keyframes fc-anim-request{0%,15%{transform:none;opacity:1}60%,85%{transform:translate(24.25px,14px)}100%{transform:none;opacity:1}}.fc-anim-request{animation:fc-anim-request 3.2s ease-in-out 0s infinite}@media (prefers-reduced-motion: reduce){.fc-anim-request{animation:none}}</style><g data-id="ground"><path d="M0 2 L147.22 87 L95.26 117 L-51.96 32 Z" fill="var(--line)" opacity="0.45"/><path d="M-51.96 30 L95.26 115 L95.26 111 L-51.96 26 Z" fill="url(#fc-plain-a)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M147.22 85 L95.26 115 L95.26 111 L147.22 81 Z" fill="url(#fc-plain-b)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M0 -4 L147.22 81 L95.26 111 L-51.96 26 Z" fill="var(--iso-top)" stroke="var(--line-strong)" stroke-width="1.4" stroke-linejoin="round"/><path d="M95.26 115 L95.26 111" fill="none" stroke="var(--iso-top)" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/></g><g data-id="client"><path d="M-27.71 20 L-12.12 29 L-12.12 13 L-27.71 4 Z" fill="url(#fc-plain-a)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M3.46 20 L-12.12 29 L-12.12 13 L3.46 4 Z" fill="url(#fc-plain-b)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M-12.12 -5 L3.46 4 L-12.12 13 L-27.71 4 Z" fill="var(--iso-top)" stroke="var(--line-strong)" stroke-width="1.2" stroke-linejoin="round"/><path d="M-12.12 29 L-12.12 13" fill="none" stroke="var(--iso-top)" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/></g><g class="fc-anim-request" data-id="request"><path d="M-3.46 28 L3.46 32 L3.46 24 L-3.46 20 Z" fill="url(#fc-plain-a)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M10.39 28 L3.46 32 L3.46 24 L10.39 20 Z" fill="url(#fc-plain-b)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M3.46 16 L10.39 20 L3.46 24 L-3.46 20 Z" fill="var(--iso-top)" stroke="var(--line-strong)" stroke-width="1.2" stroke-linejoin="round"/><path d="M3.46 32 L3.46 24" fill="none" stroke="var(--iso-top)" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/></g><g data-id="edge"><path d="M17.32 52 L45.03 68 L45.03 32 L17.32 16 Z" fill="url(#fc-ink-a)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M72.74 52 L45.03 68 L45.03 32 L72.74 16 Z" fill="url(#fc-ink-b)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M45.03 0 L72.74 16 L45.03 32 L17.32 16 Z" fill="var(--iso-ink-top)" stroke="var(--line-strong)" stroke-width="1.2" stroke-linejoin="round"/><path d="M45.03 68 L45.03 32" fill="none" stroke="var(--iso-ink-top)" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/></g><g data-id="origin"><path d="M77.94 87 L98.72 99 L98.72 47 L77.94 35 Z" fill="url(#fc-plain-a)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M126.44 83 L98.72 99 L98.72 47 L126.44 31 Z" fill="url(#fc-plain-b)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M105.65 19 L126.44 31 L98.72 47 L77.94 35 Z" fill="var(--iso-top)" stroke="var(--line-strong)" stroke-width="1.2" stroke-linejoin="round"/><path d="M98.72 99 L98.72 47" fill="none" stroke="var(--iso-top)" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/></g><g data-id="hit"><circle class="dot" r="1" transform="translate(45.03 16) scale(2.99 1.74)" fill="var(--ok)"/></g><g class="fc-label"><line class="leader" x1="-12.12" y1="4" x2="-64.96" y2="4" stroke="var(--muted)" stroke-width="0.75"/><text x="-67.96" y="4" text-anchor="end" dominant-baseline="middle" font-size="20" font-family="system-ui, sans-serif" fill="var(--fg)">Client</text></g><g class="fc-label"><line class="leader" x1="3.46" y1="20" x2="-64.96" y2="27" stroke="var(--muted)" stroke-width="0.75"/><text x="-67.96" y="27" text-anchor="end" dominant-baseline="middle" font-size="20" font-family="system-ui, sans-serif" fill="var(--fg)">Request</text></g><g class="fc-label"><line class="leader" x1="45.03" y1="8" x2="160.22" y2="8" stroke="var(--muted)" stroke-width="0.75"/><text x="163.22" y="8" text-anchor="start" dominant-baseline="middle" font-size="20" font-family="system-ui, sans-serif" fill="var(--fg)">Edge cache</text></g><g class="fc-label"><line class="leader" x1="102.19" y1="33" x2="160.22" y2="33" stroke="var(--muted)" stroke-width="0.75"/><text x="163.22" y="33" text-anchor="start" dominant-baseline="middle" font-size="20" font-family="system-ui, sans-serif" fill="var(--fg)">Origin (skipped)</text></g></svg><figcaption>The request moves along one axis to the edge cache. The green light means a cache hit.</figcaption>
<div class="controls"><button type="button" id="play" aria-pressed="true">Pause motion</button></div></figure>
<dl><div><dt>Client</dt><dd>Sends the request</dd></div><div><dt>Edge cache</dt><dd>Holds a nearby copy</dd></div><div><dt>Origin</dt><dd>Only asked on a miss</dd></div></dl>
</main><script>(function(){var r=document.documentElement,tb=document.getElementById('theme'),pb=document.getElementById('play'),f=document.getElementById('fig'),mq=matchMedia('(prefers-color-scheme: dark)');
function d(){var t=r.getAttribute('data-theme');return t?t==='dark':mq.matches}function s(){var x=d();tb.textContent=x?'Light theme':'Dark theme';tb.setAttribute('aria-pressed',String(x))}
tb.onclick=function(){r.setAttribute('data-theme',d()?'light':'dark');s()};if(mq.addEventListener)mq.addEventListener('change',s);
if(matchMedia('(prefers-reduced-motion: reduce)').matches)pb.hidden=true;
pb.onclick=function(){var p=f.classList.toggle('paused');pb.textContent=p?'Play motion':'Pause motion';pb.setAttribute('aria-pressed',String(!p))};s()})();</script></body></html>
