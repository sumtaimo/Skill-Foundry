<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How a CDN edge cache serves a request</title>
<script>try{var t=localStorage.getItem('fc-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
:root{--bg:#f7f6f2;--surface:#ffffff;--surface2:#efede6;--line:#d9d5ca;--line-strong:#8f8a7c;--fg:#1d1c19;--muted:#5c5850;--faint:#8a857a;--ok:#2f8f5b;--warn:#b7791f;--danger:#c0392b;--iso-top:#ffffff;--iso-a:#e6e2d8;--iso-b:#cfc9bb;--iso-ink:#2b2a27;--iso-ink-top:#4a4843;--iso-ink-a:#33312d;--iso-ink-b:#22211e;}
[data-theme="dark"]{--bg:#141413;--surface:#1d1c1a;--surface2:#262522;--line:#3a3833;--line-strong:#77736a;--fg:#f1efe8;--muted:#b3aea2;--faint:#8a857a;--ok:#4fbf83;--warn:#e0a84a;--danger:#e5675a;--iso-top:#3b3934;--iso-a:#2d2b27;--iso-b:#22211e;--iso-ink:#e8e4da;--iso-ink-top:#f6f3ec;--iso-ink-a:#d6d1c5;--iso-ink-b:#bdb7a9;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141413;--surface:#1d1c1a;--surface2:#262522;--line:#3a3833;--line-strong:#77736a;--fg:#f1efe8;--muted:#b3aea2;--faint:#8a857a;--ok:#4fbf83;--warn:#e0a84a;--danger:#e5675a;--iso-top:#3b3934;--iso-a:#2d2b27;--iso-b:#22211e;--iso-ink:#e8e4da;--iso-ink-top:#f6f3ec;--iso-ink-a:#d6d1c5;--iso-ink-b:#bdb7a9;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:1.5rem;line-height:1.25;margin:0}
.kicker{color:var(--muted);font-size:.85rem;margin:0 0 4px;letter-spacing:.04em}
button{font:inherit;font-size:.9rem;color:var(--fg);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:6px 12px;cursor:pointer}
button:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
figure{margin:24px 0;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
figure svg{display:block;width:100%;max-width:560px;height:auto;margin:0 auto}
figcaption{color:var(--muted);font-size:.9rem;margin-top:8px}
.controls{display:flex;gap:8px;margin-top:12px}
.paused svg *{animation-play-state:paused!important}
dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:0}
dl div{background:var(--surface2);border-radius:10px;padding:12px}
dt{color:var(--muted);font-size:.8rem}
dd{margin:0;font-weight:600}
@media (max-width:480px){figure{padding:8px}}
</style>
</head>
<body>
<main>
<header>
<div><p class="kicker">FIGURE</p><h1>How a CDN edge cache serves a request</h1></div>
<button type="button" id="theme" aria-pressed="false">Dark theme</button>
</header>
<p>The edge cache sits close to the reader. When it already holds a copy, it answers at once and the origin is never asked.</p>
<figure id="fig">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-143.09 -17 453.94 143" role="img"><title>A request travels from the client to the edge cache, which answers it without asking the origin.</title><defs><linearGradient id="fc-plain-a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--iso-a)"/><stop offset="0.12" stop-color="var(--iso-top)" stop-opacity="0.35"/><stop offset="0.3" stop-color="var(--iso-a)"/><stop offset="1" stop-color="var(--iso-a)"/></linearGradient><linearGradient id="fc-plain-b" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--iso-b)"/><stop offset="0.85" stop-color="var(--iso-b)"/><stop offset="1" stop-color="var(--iso-a)"/></linearGradient><linearGradient id="fc-ink-a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--iso-ink-a)"/><stop offset="0.12" stop-color="var(--iso-ink-top)" stop-opacity="0.35"/><stop offset="0.3" stop-color="var(--iso-ink-a)"/><stop offset="1" stop-color="var(--iso-ink-a)"/></linearGradient><linearGradient id="fc-ink-b" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--iso-ink-b)"/><stop offset="0.85" stop-color="var(--iso-ink-b)"/><stop offset="1" stop-color="var(--iso-ink-a)"/></linearGradient></defs><style>@keyframes fc-anim-request{0%,15%{transform:none;opacity:1}60%,85%{transform:translate(22.52px,13px)}100%{transform:none;opacity:1}}.fc-anim-request{animation:fc-anim-request 3.2s ease-in-out 0s infinite}@media (prefers-reduced-motion: reduce){.fc-anim-request{animation:none}}</style><g data-id="ground"><path d="M0 2 L138.56 82 L86.6 112 L-51.96 32 Z" fill="var(--line)" opacity="0.45"/><path d="M-51.96 30 L86.6 110 L86.6 106 L-51.96 26 Z" fill="url(#fc-plain-a)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M138.56 80 L86.6 110 L86.6 106 L138.56 76 Z" fill="url(#fc-plain-b)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M0 -4 L138.56 76 L86.6 106 L-51.96 26 Z" fill="var(--iso-top)" stroke="var(--line-strong)" stroke-width="1.4" stroke-linejoin="round"/><path d="M86.6 110 L86.6 106" fill="none" stroke="var(--iso-top)" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/></g><g data-id="client"><path d="M-27.71 20 L-12.12 29 L-12.12 13 L-27.71 4 Z" fill="url(#fc-plain-a)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M3.46 20 L-12.12 29 L-12.12 13 L3.46 4 Z" fill="url(#fc-plain-b)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M-12.12 -5 L3.46 4 L-12.12 13 L-27.71 4 Z" fill="var(--iso-top)" stroke="var(--line-strong)" stroke-width="1.2" stroke-linejoin="round"/><path d="M-12.12 29 L-12.12 13" fill="none" stroke="var(--iso-top)" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/></g><g data-id="client-screen"><path d="M0.87 9.5 L-9.53 15.5" fill="none" stroke="var(--line-strong)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><g class="fc-anim-request" data-id="request"><path d="M-3.46 28 L3.46 32 L3.46 24 L-3.46 20 Z" fill="url(#fc-plain-a)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M10.39 28 L3.46 32 L3.46 24 L10.39 20 Z" fill="url(#fc-plain-b)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M3.46 16 L10.39 20 L3.46 24 L-3.46 20 Z" fill="var(--iso-top)" stroke="var(--line-strong)" stroke-width="1.2" stroke-linejoin="round"/><path d="M3.46 32 L3.46 24" fill="none" stroke="var(--iso-top)" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/></g><g data-id="edge"><path d="M15.59 51 L43.3 67 L43.3 31 L15.59 15 Z" fill="url(#fc-ink-a)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M71.01 51 L43.3 67 L43.3 31 L71.01 15 Z" fill="url(#fc-ink-b)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M43.3 -1 L71.01 15 L43.3 31 L15.59 15 Z" fill="var(--iso-ink-top)" stroke="var(--line-strong)" stroke-width="1.2" stroke-linejoin="round"/><path d="M43.3 67 L43.3 31" fill="none" stroke="var(--iso-ink-top)" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/></g><g data-id="origin"><path d="M71.01 83 L91.8 95 L91.8 43 L71.01 31 Z" fill="url(#fc-plain-a)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M119.51 79 L91.8 95 L91.8 43 L119.51 27 Z" fill="url(#fc-plain-b)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M98.72 15 L119.51 27 L91.8 43 L71.01 31 Z" fill="var(--iso-top)" stroke="var(--line-strong)" stroke-width="1.2" stroke-linejoin="round"/><path d="M91.8 95 L91.8 43" fill="none" stroke="var(--iso-top)" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/></g><g data-id="origin-bay-1"><path d="M116.04 41 L95.26 53" fill="none" stroke="var(--line-strong)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><g data-id="origin-bay-2"><path d="M116.04 51 L95.26 63" fill="none" stroke="var(--line-strong)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><g data-id="origin-bay-3"><path d="M116.04 61 L95.26 73" fill="none" stroke="var(--line-strong)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><g data-id="dot9"><circle class="dot" r="1" transform="translate(43.3 15) scale(2.99 1.74)" fill="var(--ok)"/></g><g class="fc-label"><line class="leader" x1="-12.12" y1="4" x2="-64.96" y2="4" stroke="var(--muted)" stroke-width="0.75"/><text x="-67.96" y="4" text-anchor="end" dominant-baseline="middle" font-size="16" font-family="system-ui, sans-serif" fill="var(--fg)">Client</text></g><g class="fc-label"><line class="leader" x1="3.46" y1="20" x2="-64.96" y2="23" stroke="var(--muted)" stroke-width="0.75"/><text x="-67.96" y="23" text-anchor="end" dominant-baseline="middle" font-size="16" font-family="system-ui, sans-serif" fill="var(--fg)">Request</text></g><g class="fc-label"><line class="leader" x1="43.3" y1="5" x2="151.56" y2="5" stroke="var(--muted)" stroke-width="0.75"/><text x="154.56" y="5" text-anchor="start" dominant-baseline="middle" font-size="16" font-family="system-ui, sans-serif" fill="var(--fg)">Edge cache</text></g><g class="fc-label"><line class="leader" x1="95.26" y1="29" x2="151.56" y2="29" stroke="var(--muted)" stroke-width="0.75"/><text x="154.56" y="29" text-anchor="start" dominant-baseline="middle" font-size="16" font-family="system-ui, sans-serif" fill="var(--fg)">Origin (skipped)</text></g></svg>
<figcaption>The request moves along one axis to the edge cache. The green light means a cache hit.</figcaption>
<div class="controls"><button type="button" id="play" aria-pressed="true">Pause motion</button></div>
</figure>
<dl>
<div><dt>Client</dt><dd>Sends the request</dd></div>
<div><dt>Edge cache</dt><dd>Holds a nearby copy</dd></div>
<div><dt>Origin</dt><dd>Only asked on a miss</dd></div>
</dl>
</main>
<script>
(function(){
  var root=document.documentElement, tb=document.getElementById('theme'), pb=document.getElementById('play'), fig=document.getElementById('fig');
  var mq=window.matchMedia('(prefers-color-scheme: dark)');
  function isDark(){var t=root.getAttribute('data-theme');return t?t==='dark':mq.matches;}
  function sync(){var d=isDark();tb.textContent=d?'Light theme':'Dark theme';tb.setAttribute('aria-pressed',String(d));}
  tb.addEventListener('click',function(){var next=isDark()?'light':'dark';root.setAttribute('data-theme',next);try{localStorage.setItem('fc-theme',next);}catch(e){}sync();});
  if(mq.addEventListener)mq.addEventListener('change',sync);
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){pb.hidden=true;}
  pb.addEventListener('click',function(){var p=fig.classList.toggle('paused');pb.textContent=p?'Play motion':'Pause motion';pb.setAttribute('aria-pressed',String(!p));});
  sync();
})();
</script>
</body>
</html>
