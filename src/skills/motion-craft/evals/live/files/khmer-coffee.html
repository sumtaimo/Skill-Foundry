<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title lang="km">ដើមត្នោត</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600&family=Suwannaphum:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ground: #E8DFD2;
      --ink: #2B2119;
      --accent: #6E3B1E;

      --cup-body: #2B2119;
      --cup-body-deep: #1E1610;
      --cup-highlight: #F6EFE5;
      --cup-accent: #6E3B1E;
      --cup-accent-light: #A26338;
      --saucer-base: #3F3025;
      --steam-fill: #6E3B1E;

      --font-display: "Suwannaphum", "Kantumruy Pro", sans-serif;
      --font-body: "Kantumruy Pro", sans-serif;
      --display-size: clamp(36px, 5.2vw, 144px);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      background-color: var(--ground);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      letter-spacing: 0;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100svh;
      background-color: var(--ground);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      letter-spacing: 0;
      overflow-x: clip;
    }

    /* Inverted theme tokens (Scene 2 & dark band) */
    .is-inverted {
      --ground: #2B2119;
      --ink: #E8DFD2;
      --accent: #C88A5B;

      --cup-body: #E8DFD2;
      --cup-body-deep: #CFC0AB;
      --cup-highlight: #FFF9F0;
      --cup-accent: #C88A5B;
      --cup-accent-light: #E4B286;
      --saucer-base: #BFAEA0;
      --steam-fill: #C88A5B;
    }

    /* Keyboard scene-jump links: visually hidden until focused */
    .scene-nav {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 30;
      display: flex;
      gap: 8px;
      pointer-events: none;
    }

    .scene-nav a {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
      pointer-events: auto;
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      letter-spacing: 0;
      text-decoration: none;
    }

    .scene-nav a:focus-visible {
      position: static;
      width: auto;
      height: auto;
      margin: 0;
      padding: 8px 16px;
      overflow: visible;
      clip: auto;
      background-color: var(--ink);
      color: var(--ground);
      outline: 3px solid var(--accent);
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* Typography */
    .display-line {
      margin: 0;
      font-family: var(--font-display);
      font-size: var(--display-size);
      font-weight: 700;
      line-height: 1.6;
      letter-spacing: 0;
      color: var(--ink);
      max-width: 100%;
      white-space: nowrap;
    }

    /* SVG hidden symbol container for static fallback */
    .svg-defs {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      pointer-events: none;
    }

    /* =====================================================================
       STATIC FALLBACK (default when JS is off or prefers-reduced-motion)
       ===================================================================== */
    .static-fallback {
      display: block;
      width: 100%;
    }

    .static-scene {
      background-color: var(--ground);
      color: var(--ink);
      padding: clamp(28px, 5vw, 64px) 24px;
      width: 100%;
    }

    .static-scene__inner {
      max-width: 1320px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      align-items: center;
      justify-items: center;
    }

    .static-scene__motif {
      width: 100%;
      max-width: 340px;
      aspect-ratio: 360 / 320;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .static-scene__motif svg {
      width: auto;
      height: auto;
      max-width: 85%;
      max-height: 85%;
      display: block;
    }

    .static-scene--2 .static-scene__motif svg {
      transform: scale(1.65) rotate(-6deg);
      transform-origin: 50% 40%;
    }

    .static-scene__text {
      width: 100%;
      max-width: 60ch;
      text-align: center;
    }

    @media (min-width: 768px) {
      .static-scene--1 .static-scene__inner,
      .static-scene--2 .static-scene__inner {
        grid-template-columns: minmax(0, 60%) minmax(0, 40%);
        gap: 0;
      }

      .static-scene--1 .static-scene__motif {
        max-width: 520px;
        justify-self: center;
      }

      .static-scene--1 .static-scene__text {
        text-align: left;
        padding: 0 clamp(24px, 3vw, 48px);
      }

      .static-scene--2 .static-scene__inner {
        grid-template-columns: minmax(0, 40%) minmax(0, 60%);
      }

      .static-scene--2 .static-scene__text {
        order: 1;
        text-align: left;
        padding: 0 clamp(24px, 3vw, 48px);
      }

      .static-scene--2 .static-scene__motif {
        order: 2;
        max-width: 520px;
        justify-self: center;
      }

      .static-scene--3 .static-scene__inner {
        grid-template-columns: 1fr;
        justify-items: center;
      }

      .static-scene--3 .static-scene__motif {
        max-width: 460px;
      }

      .static-scene--3 .static-scene__text {
        text-align: center;
      }
    }

    /* =====================================================================
       ACTIVE SCROLLYTELLING STAGE
       ===================================================================== */
    .track {
      display: none;
    }

    html.stage-active .static-fallback {
      display: none;
    }

    html.stage-active .track {
      display: block;
      position: relative;
      height: 450vh;
      width: 100%;
    }

    .stage {
      position: sticky;
      top: 0;
      height: 100svh;
      width: 100%;
      overflow-x: clip;
      background-color: #E8DFD2;
      color: var(--ink);
      isolation: isolate;
    }

    /* Background layer strictly behind motif and text (z-index 0) */
    .stage-bg-invert {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-color: #2B2119;
      opacity: 0;
      pointer-events: none;
      will-change: opacity;
    }

    /* Single persistent motif box (z-index 1) */
    .motif-box {
      position: absolute;
      z-index: 1;
      overflow: hidden;
      min-width: 0;
      min-height: 0;
      pointer-events: none;

      /* Mobile default: top 0 to 45% inside 24px gutters */
      top: 0;
      left: 24px;
      right: 24px;
      height: 45%;
    }

    .motif-graphic {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      will-change: transform;
      transform-origin: 50% 40%;
    }

    .motif-svg {
      width: auto;
      height: auto;
      max-width: 85%;
      max-height: 85%;
      display: block;
      overflow: visible;
    }

    .motif-cup,
    .motif-saucer,
    .motif-steam,
    .steam-ribbon {
      will-change: transform;
    }

    /* Text layer strictly above motif and background (z-index 2) */
    .text-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    /* ONE opacity wrapper per scene; inner .copy/.mask stay at opacity 1 */
    .scene-text {
      position: absolute;
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      will-change: opacity;

      /* Mobile default: 52% to 94% height inside 24px gutters */
      top: 52%;
      height: 42%;
      left: 24px;
      right: 24px;
      justify-content: flex-start;
      text-align: left;
    }

    .scene-text--1 {
      opacity: 1;
    }

    .scene-text--2,
    .scene-text--3 {
      opacity: 0;
    }

    .scene-text--3 {
      justify-content: center;
      text-align: center;
    }

    .copy {
      opacity: 1;
      max-width: 100%;
      min-width: 0;
    }

    .mask {
      opacity: 1;
      padding: 0.2em 0.08em;
      margin: -0.2em -0.08em;
      max-width: 100%;
      will-change: transform, clip-path;
      clip-path: inset(0% 0% 0% 0%);
    }

    /* Desktop layout (>= 768px, verified at 1440x900) */
    @media (min-width: 768px) {
      /* Scenes 1 & 2: motif box is 60% width x 100% height */
      .motif-box {
        top: 0;
        left: 0;
        right: auto;
        width: 60%;
        height: 100%;
      }

      /* Scene 3 lockup: top 64% full width */
      .stage.is-scene-3 .motif-box {
        top: 0;
        left: 0;
        width: 100%;
        height: 64%;
        transform: none;
      }

      /* Keep SVG height consistent across Scene 1/2 (100% box) and Scene 3 (64% box) */
      .motif-svg {
        max-width: 85%;
        max-height: min(85%, 54svh);
      }

      /* Scene 1 text: right 40%, vertically centred */
      .scene-text--1 {
        top: 0;
        left: 60%;
        right: 0;
        width: 40%;
        height: 100%;
        padding: 0 clamp(24px, 3.5vw, 64px);
        justify-content: flex-start;
        text-align: left;
      }

      /* Scene 2 text: left 40%, vertically centred */
      .scene-text--2 {
        top: 0;
        left: 0;
        right: auto;
        width: 40%;
        height: 100%;
        padding: 0 clamp(24px, 3.5vw, 64px);
        justify-content: flex-start;
        text-align: left;
      }

      /* Scene 3 text: bottom 36%, full width, centred lockup */
      .scene-text--3 {
        top: 64%;
        left: 0;
        right: 0;
        width: 100%;
        height: 36%;
        padding: 0 24px;
        justify-content: center;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <script>
    (function () {

        '--cup-accent': [110, 59, 30],
        '--cup-accent-light': [162, 99, 56],
        '--saucer-base': [63, 48, 37],
        '--steam-fill': [110, 59, 30]
      };

      var DARK_VARS = {
        '--ground': [43, 33, 25],
        '--ink': [232, 223, 210],
        '--accent': [200, 138, 91],
        '--cup-body': [232, 223, 210],
        '--cup-body-deep': [207, 192, 171],
        '--cup-highlight': [255, 249, 240],
        '--cup-accent': [200, 138, 91],
        '--cup-accent-light': [228, 178, 134],
        '--saucer-base': [191, 174, 160],
        '--steam-fill': [200, 138, 91]
      };

      var VAR_KEYS = Object.keys(LIGHT_VARS);

      var active = false;
      var targetP = 0;
      var drawn = 0;
      var rafId = 0;
      var lastTime = 0;

      function clamp(val, min, max) {
        return val < min ? min : (val > max ? max : val);
      }

      /* Exact cubic-bezier(0.22, 1, 0.36, 1) */
      function bezierCoord(t, p1, p2) {
        var u = 1 - t;
        return 3 * u * u * t * p1 + 3 * u * t * t * p2 + t * t * t;
      }

      function bezierSlope(t, p1, p2) {
        var u = 1 - t;
        return 3 * u * u * p1 + 6 * u * t * (p2 - p1) + 3 * t * t * (1 - p2);
      }

      function ease(x) {
        if (x <= 0) return 0;
        if (x >= 1) return 1;
        var t = x;
        for (var i = 0; i < 6; i++) {
          var err = bezierCoord(t, 0.22, 0.36) - x;
          var slope = bezierSlope(t, 0.22, 0.36);
          if (Math.abs(err) < 1e-6 || Math.abs(slope) < 1e-6) break;
          t = clamp(t - err / slope, 0, 1);
        }
        return bezierCoord(t, 1, 1);
      }

      function range(val, start, end) {
        if (val <= start) return 0;
        if (val >= end) return 1;
        return ease((val - start) / (end - start));
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function toHex(rgb) {
        var r = Math.round(rgb[0]).toString(16).padStart(2, '0');
        var g = Math.round(rgb[1]).toString(16).padStart(2, '0');
        var b = Math.round(rgb[2]).toString(16).padStart(2, '0');
        return '#' + r + g + b;
      }

      function applyTheme(inv) {
        stageBgInvert.style.opacity = inv.toFixed(4);
        var inverted = inv >= 0.5;
        stage.classList.toggle('is-inverted', inverted);
        root.classList.toggle('is-inverted', inverted);

        if (inv <= 0.001 || inv >= 0.999) {
          for (var i = 0; i < VAR_KEYS.length; i++) {
            stage.style.removeProperty(VAR_KEYS[i]);
          }
        } else {
          for (var j = 0; j < VAR_KEYS.length; j++) {
            var key = VAR_KEYS[j];
            var a = LIGHT_VARS[key];
            var b = DARK_VARS[key];
            stage.style.setProperty(key, toHex([
              lerp(a[0], b[0], inv),
              lerp(a[1], b[1], inv),
              lerp(a[2], b[2], inv)
            ]));
          }
        }
      }

      function computeProgress() {
        var span = track.offsetHeight - stage.offsetHeight;
        if (span <= 0) return 0;
        return clamp(-track.getBoundingClientRect().top / span, 0, 1);
      }

      function fitDisplayText() {
        var headings = document.querySelectorAll('.stage .display-line');
        var vw = window.innerWidth;
        var baseSize = clamp(vw * 0.052, 36, 144);
        for (var i = 0; i < headings.length; i++) {
          var h = headings[i];
          var wrapper = h.closest('.scene-text');
          if (!wrapper) continue;
          h.style.fontSize = baseSize + 'px';
          var cs = window.getComputedStyle(wrapper);
          var padX = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
          var maxW = Math.max(0, wrapper.clientWidth - padX - 8);
          var actualW = h.scrollWidth;
          if (maxW > 0 && actualW > maxW) {
            var scaled = Math.max(36, Math.floor(baseSize * (maxW / actualW)));
            h.style.fontSize = scaled + 'px';
          }
        }
      }

      function setSceneTextState(wrapper, mask, opacity, ty, clipTopPct, clipBottomPct) {
        wrapper.style.opacity = opacity.toFixed(4);
        wrapper.setAttribute('aria-hidden', opacity <= 0.001 ? 'true' : 'false');
        mask.style.transform = 'translate3d(0,' + ty.toFixed(2) + 'px,0)';
        mask.style.clipPath = 'inset(' + clipTopPct.toFixed(2) + '% 0% ' + clipBottomPct.toFixed(2) + '% 0%)';
      }

      function render(d) {
        /* 1. Theme & inverted field swap: 32-34% in, 66-68% out */
        var invIn = range(d, 0.32, 0.34);
        var invOut = range(d, 0.66, 0.68);
        var inv = invIn * (1 - invOut);
        applyTheme(inv);

        /* 2. Scene text states (outgoing reaches opacity 0 before incoming enters) */
        // Scene 1: hold 0-26, out 26-32
        var s1Out = range(d, 0.26, 0.32);
        setSceneTextState(sceneText1, mask1, 1 - s1Out, -18 * s1Out, 0, s1Out * 100);

        // Scene 2: in 34-40, hold 40-60, out 60-66
        var s2In = range(d, 0.34, 0.40);
        var s2Out = range(d, 0.60, 0.66);
        var s2Op = s2In * (1 - s2Out);
        var s2Ty = (1 - s2In) * 20 - s2Out * 18;
        var s2ClipTop = s2Out * 100;
        var s2ClipBottom = (1 - s2In) * 100;
        setSceneTextState(sceneText2, mask2, s2Op, s2Ty, s2ClipTop, s2ClipBottom);

        // Scene 3: in 68-74, hold 74-100
        var s3In = range(d, 0.68, 0.74);
        setSceneTextState(sceneText3, mask3, s3In, (1 - s3In) * 20, 0, (1 - s3In) * 100);

        /* 3. Motif layout & transform choreography (pure function of drawn) */
        var tS1 = range(d, 0.0, 0.26);
        var t12 = range(d, 0.26, 0.40);
        var t23 = range(d, 0.60, 0.74);
        var zoomPhase = t12 * (1 - t23);

        var scale = 1 + zoomPhase;
        var rotateDeg = -6 * zoomPhase;

        var stageW = stage.clientWidth;
        var stageH = stage.clientHeight;
        var isDesktop = window.innerWidth >= 768;

        if (isDesktop) {
          var isScene3Box = d >= 0.67;
          stage.classList.toggle('is-scene-3', isScene3Box);

          // Box position: stays strictly non-overlapping with text whenever text is visible
          // Left [0..60%] while Scene 1 text is visible (<= 32%), glides across 32-34% (both texts hidden),
          // Right [40..100%] while Scene 2 text is visible (34-66%), switches to top 64% lockup at 67%
          var boxShiftT = range(d, 0.32, 0.34);
          var boxCenterX, boxCenterY;

          if (isScene3Box) {
            motifBox.style.transform = 'none';
            boxCenterX = stageW * 0.50;
            boxCenterY = stageH * 0.32;
          } else {
            var boxOffsetX = boxShiftT * stageW * 0.40;
            motifBox.style.transform = 'translate3d(' + boxOffsetX.toFixed(2) + 'px, 0, 0)';
            boxCenterX = boxOffsetX + stageW * 0.30;
            boxCenterY = stageH * 0.50;
          }

          // Continuous stage-space focal center of the motif:
          // Scene 1: 50%/50% of left 60% box -> (30% stageW, 50% stageH)
          // Scene 2: 52%/46% of right 60% box -> (40% + 0.52*60% = 71.2% stageW, 46% stageH)
          // Scene 3: 50%/50% of top 64% box -> (50% stageW, 32% stageH)
          var x12 = lerp(stageW * 0.30, stageW * 0.712, t12);
          var y12 = lerp(stageH * 0.50, stageH * 0.46, t12);
          var targetX = lerp(x12, stageW * 0.50, t23);
          var targetY = lerp(y12, stageH * 0.32, t23);

          var dx = targetX - boxCenterX;
          var dy = targetY - boxCenterY;

          motifGraphic.style.transform =
            'translate3d(' + dx.toFixed(2) + 'px,' + dy.toFixed(2) + 'px,0) ' +
            'scale(' + scale.toFixed(4) + ') ' +
            'rotate(' + rotateDeg.toFixed(3) + 'deg)';
        } else {
          stage.classList.remove('is-scene-3');
          motifBox.style.transform = 'none';

          // Mobile: motif box is fixed top 0..45% in every scene
          // Scene 1 & 3: 50%/50% of box; Scene 2: 52%/46% of box
          var boxW = motifBox.clientWidth;
          var boxH = motifBox.clientHeight;
          var mx = (0.02 * boxW) * zoomPhase;
          var my = (-0.04 * boxH) * zoomPhase;

          motifGraphic.style.transform =
            'translate3d(' + mx.toFixed(2) + 'px,' + my.toFixed(2) + 'px,0) ' +
            'scale(' + scale.toFixed(4) + ') ' +
            'rotate(' + rotateDeg.toFixed(3) + 'deg)';
        }

        /* 4. Internal cup settle & steam ribbons choreography */
        // Cup subtly lifts during Scene 2 zoom and settles onto saucer across 60-74%
        var cupLiftY = -3.5 * zoomPhase;
        motifCup.style.transform = 'translate3d(0,' + cupLiftY.toFixed(2) + 'px,0)';

        // Steam rises subtly in Scene 1 (0-26%), rises further & widens in Scene 2 (26-40%),
        // and parts gently in Scene 3 (60-74%)
        var steamRiseY = -5 * tS1 * (1 - t23) - 9 * zoomPhase;
        var steamScaleX = 1 + 0.16 * zoomPhase;
        var steamScaleY = 1 + 0.08 * zoomPhase;
        motifSteam.style.transformOrigin = '166px 120px';
        motifSteam.style.transform =
          'translate3d(0,' + steamRiseY.toFixed(2) + 'px,0) ' +
          'scale(' + steamScaleX.toFixed(4) + ',' + steamScaleY.toFixed(4) + ')';

        // Steam parting in Scene 3
        var partX = 14 * t23;
        var partRot = 6 * t23;
        steam1.style.transformOrigin = '124px 120px';
        steam1.style.transform = 'translate3d(' + (-partX).toFixed(2) + 'px,0,0) rotate(' + (-partRot).toFixed(2) + 'deg)';

        steam2.style.transformOrigin = '166px 120px';
        steam2.style.transform = 'translate3d(0,' + (-6 * t23).toFixed(2) + 'px,0) scale(' + (1 - 0.04 * t23).toFixed(4) + ')';

        steam3.style.transformOrigin = '210px 120px';
        steam3.style.transform = 'translate3d(' + partX.toFixed(2) + 'px,0,0) rotate(' + partRot.toFixed(2) + 'deg)';
      }

      function tick(now) {
        if (!active) {
          rafId = 0;
          return;
        }
        var dt = lastTime ? Math.min(now - lastTime, 100) : 16.67;
        lastTime = now;

        targetP = computeProgress();
        drawn += (targetP - drawn) * (1 - Math.exp(-dt / 120));

        if (Math.abs(targetP - drawn) < 0.00008) {
          drawn = targetP;
          render(drawn);
          rafId = 0;
          lastTime = 0;
          return;
        }

        render(drawn);
        rafId = window.requestAnimationFrame(tick);
      }

      function requestTick() {
        if (!active || rafId) return;
        lastTime = 0;
        rafId = window.requestAnimationFrame(tick);
      }

      function snapToCurrentScroll() {
        if (!active) return;
        if (rafId) {
          window.cancelAnimationFrame(rafId);
          rafId = 0;
          lastTime = 0;
        }
        targetP = computeProgress();
        drawn = targetP;
        render(drawn);
      }

      function scrollToProgress(p) {
        if (!active) return;
        var trackTop = track.getBoundingClientRect().top + window.scrollY;
        var span = track.offsetHeight - stage.offsetHeight;
        var destY = Math.round(trackTop + clamp(p, 0, 1) * Math.max(0, span));
        window.scrollTo(0, destY);
        snapToCurrentScroll();
      }

      function handleHashJump() {
        if (!active) return;
        var h = window.location.hash;
        if (Object.prototype.hasOwnProperty.call(SCENE_HASH_P, h)) {
          scrollToProgress(SCENE_HASH_P[h]);
        }
      }

      function activateStage() {
        if (active) return;
        active = true;
        root.classList.add('stage-active');
        track.setAttribute('aria-hidden', 'false');
        staticFallback.setAttribute('aria-hidden', 'true');
        fitDisplayText();
        if (Object.prototype.hasOwnProperty.call(SCENE_HASH_P, window.location.hash)) {
          handleHashJump();
        } else {
          snapToCurrentScroll();
        }
      }

      function deactivateStage() {
        active = false;
        if (rafId) {
          window.cancelAnimationFrame(rafId);
          rafId = 0;
        }
        root.classList.remove('stage-active');
        root.classList.remove('is-inverted');
        stage.classList.remove('is-inverted');
        stage.classList.remove('is-scene-3');
        track.setAttribute('aria-hidden', 'true');
        staticFallback.setAttribute('aria-hidden', 'false');
        for (var i = 0; i < VAR_KEYS.length; i++) {
          stage.style.removeProperty(VAR_KEYS[i]);
        }
      }

      function onScroll() {
        if (!active) return;
        requestTick();
      }

      function onResize() {
        if (!active) return;
        fitDisplayText();
        snapToCurrentScroll();
      }

      function bindNavigation() {
        navLinks.forEach(function (link) {
          var p = parseFloat(link.getAttribute('data-target-p'));
          if (isNaN(p)) return;

          link.addEventListener('focus', function () {
            if (active) {
              scrollToProgress(p);
            }
          });

          link.addEventListener('click', function (ev) {
            if (!active) return;
            ev.preventDefault();
            var href = link.getAttribute('href');
            if (href && window.history && window.history.replaceState) {
              window.history.replaceState(null, '', href);
            }
            scrollToProgress(p);
          });
        });
      }

      try {
        var reducedMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
        bindNavigation();

        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', onResize, { passive: true });
        window.addEventListener('hashchange', handleHashJump);
        window.addEventListener('pageshow', snapToCurrentScroll);
        window.addEventListener('load', function () {
          fitDisplayText();
          if (Object.prototype.hasOwnProperty.call(SCENE_HASH_P, window.location.hash)) {
            handleHashJump();
          } else {
            snapToCurrentScroll();
          }
        });

        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(function () {
            if (active) {
              fitDisplayText();
              snapToCurrentScroll();
            }
          });
        }

        function syncMotionPreference(mq) {
          if (mq.matches) {
            deactivateStage();
          } else {
            activateStage();
          }
        }

        syncMotionPreference(reducedMotionQuery);

        if (typeof reducedMotionQuery.addEventListener === 'function') {
          reducedMotionQuery.addEventListener('change', syncMotionPreference);
        } else if (typeof reducedMotionQuery.addListener === 'function') {
          reducedMotionQuery.addListener(syncMotionPreference);
        }
      } catch (err) {
        deactivateStage();
      }
    })();
  </script>
</body>
</html>
