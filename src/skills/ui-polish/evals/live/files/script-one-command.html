<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>script-one-command</title></head><body>
<!-- Polished code copied word for word from evals/live/script-one-command.json -->
<style>
.note{background:#f9fafb;padding:16px;font-family:system-ui}
.note h2{font-size:20px;line-height:1.25;margin:0 0 8px;color:#111827}
.note p{font-size:16px;line-height:1.5;max-width:65ch;color:#6b7484}
.note .tag{font-size:14px;color:#a36907;background:#ffffff;padding:4px 8px}
.note button{background:#0b8177;color:#ffffff;font-size:16px;padding:12px 16px;min-height:44px;min-width:44px}
.note button:hover{background:#096b63}
.note button:focus-visible{outline:2px solid #0b8177;outline-offset:2px}
.note button:disabled{opacity:0.5;cursor:not-allowed}
</style>
<div class="note"><h2>Team notes</h2><p>Notes from the last planning call.</p><span class="tag">Draft</span><button>Share notes</button></div>
</body></html>
