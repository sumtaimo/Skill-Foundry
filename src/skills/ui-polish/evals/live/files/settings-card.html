<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>settings-card</title></head><body>
<!-- Polished code copied word for word from evals/live/settings-card.json -->
<style>
  .card .btn {
    min-height: 44px;
    min-width: 44px;
    padding: 8px 12px;
    font-size: 16px;
    cursor: pointer;
    transition: background-color 150ms, color 150ms;
  }
  .card .btn-primary {
    background: #2563eb;
    color: #ffffff;
    border: 2px solid #2563eb;
  }
  .card .btn-primary:hover {
    background: #1d4ed8;
    border-color: #1d4ed8;
  }
  .card .btn-secondary {
    background: transparent;
    color: #2563eb;
    border: 2px solid #2563eb;
    margin-left: 8px;
  }
  .card .btn-secondary:hover {
    background: #eff6ff;
  }
  .card .btn:focus-visible {
    outline: 2px solid #2563eb;
    outline-offset: 2px;
  }
  .card .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  @media (prefers-reduced-motion: reduce) {
    .card .btn {
      transition: none;
    }
  }
</style>
<div class="card" style="padding:12px;background:#ffffff;font-family:system-ui">
  <h2 style="font-size:24px;line-height:1.2;margin:0 0 4px">Notification settings</h2>
  <p style="font-size:16px;line-height:1.5;max-width:65ch;margin:0 0 16px;color:#6b7280">Choose how we contact you about your account.</p>
  <button class="btn btn-primary">Save changes</button>
  <button class="btn btn-secondary">Cancel</button>
</div>
</body></html>
