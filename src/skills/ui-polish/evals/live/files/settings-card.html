<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>settings-card</title></head><body>
<!-- Polished code copied word for word from evals/live/settings-card.json -->
<style>
  .card .btn-primary,
  .card .btn-secondary {
    font-family: inherit;
    font-size: 16px;
    font-weight: 400;
    line-height: 1.5;
    padding: 8px 12px;
    min-height: 44px;
    min-width: 44px;
    border: 1px solid #2563eb;
    cursor: pointer;
  }
  .card .btn-primary { background: #2563eb; color: #ffffff; }
  .card .btn-primary:hover { background: #134fd2; border-color: #134fd2; }
  .card .btn-secondary { background: #ffffff; color: #2563eb; margin-left: 8px; }
  .card .btn-secondary:hover { background: #ebf1fd; color: #134fd2; border-color: #134fd2; }
  .card .btn-primary:focus-visible,
  .card .btn-secondary:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
  .card .btn-primary:disabled,
  .card .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
<div class="card" style="padding:12px;background:#ffffff;font-family:system-ui">
  <h2 style="font-size:24px;line-height:1.2;margin:0 0 4px">Notification settings</h2>
  <p style="font-size:16px;line-height:1.5;max-width:65ch;margin:0 0 16px;color:#6b7280">Choose how we contact you about your account.</p>
  <button class="btn-primary">Save changes</button>
  <button class="btn-secondary">Cancel</button>
</div>
</body></html>
