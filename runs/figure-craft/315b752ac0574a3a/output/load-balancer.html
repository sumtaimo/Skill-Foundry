<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How a load balancer spreads requests across servers</title>
<script>try{var t=localStorage.getItem('fc-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
:root{--bg:#f7f6f2;--surface:#ffffff;--surface2:#efede6;--line:#d9d5ca;--line-strong:#8f8a7c;--fg:#1d1c19;--muted:#5c5850;--faint:#8a857a;--ok:#2f8f5b;--warn:#b7791f;--danger:#c0392b;--iso-top:#ffffff;--iso-a:#e6e2d8;--iso-b:#cfc9bb;--iso-ink:#2b2a27;--iso-ink-top:#4a4843;--iso-ink-a:#33312d;--iso-ink-b:#22211e;}
[data-theme="dark"]{--bg:#141413;--surface:#1d1c1a;--surface2:#262522;--line:#3a3833;--line-strong:#77736a;--fg:#f1efe8;--muted:#b3aea2;--faint:#8a857a;--ok:#4fbf83;--warn:#e0a84a;--danger:#e5675a;--iso-top:#3b3934;--iso-a:#2d2b27;--iso-b:#22211e;--iso-ink:#e8e4da;--iso-ink-top:#f6f3ec;--iso-ink-a:#d6d1c5;--iso-ink-b:#bdb7a9;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141413;--surface:#1d1c1a;--surface2:#262522;--line:#3a3833;--line-strong:#77736a;--fg:#f1efe8;--muted:#b3aea2;--faint:#8a857a;--ok:#4fbf83;--warn:#e0a84a;--danger:#e5675a;--iso-top:#3b3934;--iso-a:#2d2b27;--iso-b:#22211e;--iso-ink:#e8e4da;--iso-ink-top:#f6f3ec;--iso-ink-a:#d6d1c5;--iso-ink-b:#bdb7a9;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:1.5rem;line-height:1.25;margin:0}
.kicker{color:var(--muted);font-size:.85rem;margin:0 0 4px;letter-spacing:.04em}
button{font:inherit;font-size:.9rem;color:var(--fg);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:6px 12px;cursor:pointer}
button:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
figure{margin:24px 0;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
figure svg{display:block;width:100%;max-width:560px;height:auto;margin:0 auto}
figcaption{color:var(--muted);font-size:.9rem;margin-top:8px}
.controls{display:flex;gap:8px;margin-top:12px}
.paused svg *{animation-play-state:paused!important}
dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:0}
dl div{background:var(--surface2);border-radius:10px;padding:12px}
dt{color:var(--muted);font-size:.8rem}
dd{margin:0;font-weight:600}
@media (max-width:480px){figure{padding:8px}}
</style>
</head>
<body>
<main>
<header>
<div><p class="kicker">FIGURE</p><h1>How a load balancer spreads requests across servers</h1></div>
<button type="button" id="theme" aria-pressed="false">Dark theme</button>
</header>
<p>A load balancer receives each request and sends it to one of three servers.</p>
<figure id="fig">

51 L22.52 93 L-72.74 38 Z" fill="var(--iso-top)" stroke="var(--line-strong)" stroke-width="1.4" stroke-linejoin="round"/><path d="M22.52 97 L22.52 93" fill="none" stroke="var(--iso-top)" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/></g><g data-id="server1"><path d="M-13.86 16 L6.93 28 L6.93 -12 L-13.86 -24 Z" fill="url(#lb-plain-a)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M24.25 18 L6.93 28 L6.93 -12 L24.25 -22 Z" fill="url(#lb-plain-b)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M3.46 -34 L24.25 -22 L6.93 -12 L-13.86 -24 Z" fill="var(--iso-top)" stroke="var(--line-strong)" stroke-width="1.2" stroke-linejoin="round"/><path d="M6.93 28 L6.93 -12" fill="none" stroke="var(--iso-top)" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/></g><g data-id="server2"><path d="M-34.64 28 L-13.86 40 L-13.86 0 L-34.64 -12 Z" fill="url(#lb-plain-a)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M3.46 30 L-13.86 40 L-13.86 0 L3.46 -10 Z" fill="url(#lb-plain-b)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M-17.32 -22 L3.46 -10 L-13.86 0 L-34.64 -12 Z" fill="var(--iso-top)" stroke="var(--line-strong)" stroke-width="1.2" stroke-linejoin="round"/><path d="M-13.86 40 L-13.86 0" fill="none" stroke="var(--iso-top)" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/></g><g data-id="server3"><path d="M-55.42 40 L-34.64 52 L-34.64 12 L-55.42 0 Z" fill="url(#lb-plain-a)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M-17.32 42 L-34.64 52 L-34.64 12 L-17.32 2 Z" fill="url(#lb-plain-b)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M-38.1 -10 L-17.32 2 L-34.64 12 L-55.42 0 Z" fill="var(--iso-top)" stroke="var(--line-strong)" stroke-width="1.2" stroke-linejoin="round"/><path d="M-34.64 52 L-34.64 12" fill="none" stroke="var(--iso-top)" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/></g><g data-id="chosen"><circle class="dot" r="1" transform="translate(-15.59 -11) scale(3.98 2.32)" fill="var(--ok)"/></g><g data-id="balancer"><path d="M13.86 58 L34.64 70 L34.64 48 L13.86 36 Z" fill="url(#lb-ink-a)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M55.42 58 L34.64 70 L34.64 48 L55.42 36 Z" fill="url(#lb-ink-b)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M34.64 24 L55.42 36 L34.64 48 L13.86 36 Z" fill="var(--iso-ink-top)" stroke="var(--line-strong)" stroke-width="1.2" stroke-linejoin="round"/><path d="M34.64 70 L34.64 48" fill="none" stroke="var(--iso-ink-top)" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/></g><g class="lb-anim-request" data-id="request"><path d="M5.2 47 L12.12 51 L12.12 43 L5.2 39 Z" fill="url(#lb-plain-a)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M19.05 47 L12.12 51 L12.12 43 L19.05 39 Z" fill="url(#lb-plain-b)" stroke="var(--line-strong)" stroke-width="0.6" stroke-linejoin="round"/><path d="M12.12 35 L19.05 39 L12.12 43 L5.2 39 Z" fill="var(--iso-top)" stroke="var(--line-strong)" stroke-width="1.2" stroke-linejoin="round"/><path d="M12.12 51 L12.12 43" fill="none" stroke="var(--iso-top)" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/></g><g class="lb-label"><line class="leader" x1="5.2" y1="-23" x2="108.26" y2="-23" stroke="var(--muted)" stroke-width="0.75"/><text x="111.26" y="-23" text-anchor="start" dominant-baseline="middle" font-size="16" font-family="system-ui, sans-serif" fill="var(--fg)">Server 1</text></g><g class="lb-label"><line class="leader" x1="-15.59" y1="-11" x2="-85.74" y2="-11" stroke="var(--muted)" stroke-width="0.75"/><text x="-88.74" y="-11" text-anchor="end" dominant-baseline="middle" font-size="16" font-family="system-ui, sans-serif" fill="var(--fg)">Server 2</text></g><g class="lb-label"><line class="leader" x1="-36.37" y1="1" x2="-85.74" y2="8" stroke="var(--muted)" stroke-width="0.75"/><text x="-88.74" y="8" text-anchor="end" dominant-baseline="middle" font-size="16" font-family="system-ui, sans-serif" fill="var(--fg)">Server 3</text></g><g class="lb-label"><line class="leader" x1="34.64" y1="36" x2="108.26" y2="36" stroke="var(--muted)" stroke-width="0.75"/><text x="111.26" y="36" text-anchor="start" dominant-baseline="middle" font-size="16" font-family="system-ui, sans-serif" fill="var(--fg)">Load balancer</text></g></svg>
<figcaption>The request moves from the load balancer to Server 2. The green dot marks the server that got it.</figcaption>
<div class="controls"><button type="button" id="play" aria-pressed="true">Pause motion</button></div>
</figure>
<dl>
<div><dt>Load balancer</dt><dd>Receives every request</dd></div>
<div><dt>Servers</dt><dd>Each one answers the requests sent to it</dd></div>
</dl>
</main>
<script>
(function(){
  var root=document.documentElement, tb=document.getElementById('theme'), pb=document.getElementById('play'), fig=document.getElementById('fig');
  var mq=window.matchMedia('(prefers-color-scheme: dark)');
  function isDark(){var t=root.getAttribute('data-theme');return t?t==='dark':mq.matches;}
  function sync(){var d=isDark();tb.textContent=d?'Light theme':'Dark theme';tb.setAttribute('aria-pressed',String(d));}
  tb.addEventListener('click',function(){var next=isDark()?'light':'dark';root.setAttribute('data-theme',next);try{localStorage.setItem('fc-theme',next);}catch(e){}sync();});
  if(mq.addEventListener)mq.addEventListener('change',sync);
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){pb.hidden=true;}
  pb.addEventListener('click',function(){var p=fig.classList.toggle('paused');pb.textContent=p?'Play motion':'Pause motion';pb.setAttribute('aria-pressed',String(!p));});
  sync();
})();
</script>
</body>
</html>
