# Builds the showcase site (src/site) and publishes it on GitHub Pages on every push to master.
# One-time setup by the owner: repository Settings → Pages → Source: "GitHub Actions".
name: site
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node src/site/build.mjs --out _site
        env:
          SITE_URL: https://sumtaimo.github.io/Skill-Foundry
      - run: node src/site/banners-png.mjs _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
